<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bent w Walad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Baloo+Bhaijaan+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful café game night, warm and quick.
   IDEA: a Sidi Bou Said door — the letter of the round is painted on a blue studded door.
   PICTURE: the arched blue door with the big letter, timer beside it.
   COLOUR and TYPE: lime-white walls, door blue #0a4c8c, flag red #d7261e for STOP; Baloo 2 + Nunito.
   LAYOUT: top bar with players and scores, door + timer, then the answer grid / review table. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1726);--wall:light-dark(#f1f5f9,#12233a);--ink:light-dark(#10213a,#e8eef7);--mute:light-dark(#5a6b82,#9fb0c6);--blue:#0a4c8c;--blue2:light-dark(#0a4c8c,#3d8be0);--red:#d7261e;--line:light-dark(#dbe3ec,#253a57);--ok:light-dark(#0f7a43,#4fd18b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(34px,6vw,52px);text-wrap:balance}
h2{font-size:24px}
.band{padding:clamp(20px,4vw,48px) max(5vw,16px);max-width:1240px;margin:0 auto}
button,input,select{font:inherit;font-size:16px}
button{min-height:44px;border-radius:12px;border:0;padding:0 18px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff}
button.ghost{background:transparent;color:var(--blue2);border:2px solid var(--blue2)}
button.red{background:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
input,select{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;width:100%}
label{font-weight:800;font-size:14px;color:var(--mute);display:block;margin-bottom:4px}
.door{position:relative;width:min(260px,70vw);aspect-ratio:3/4;border-radius:50% 50% 10px 10px/38% 38% 10px 10px;background:radial-gradient(circle,#0d1b2e 2.2px,transparent 3px) 0 0/26px 26px,linear-gradient(160deg,#1a66b3,var(--blue) 55%,#073766);box-shadow:inset 0 0 0 10px #f4f7fb,inset 0 0 0 14px #073766,0 18px 30px -18px #052a50;display:grid;place-items:center;flex:none}
.door::after{content:"";position:absolute;right:22%;top:56%;width:14px;height:14px;border-radius:50%;background:#e8c35a;box-shadow:0 2px 0 #9a7a22}
.door b{font:800 clamp(110px,22vw,170px)/1 "Baloo 2",sans-serif;color:#fff;text-shadow:0 6px 0 #052a50}
.hero{display:flex;gap:clamp(20px,5vw,60px);align-items:center;flex-wrap:wrap}
.hero>div{flex:1 1 300px}
.card{background:var(--wall);border-radius:18px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 160px}
.row>button{flex:0 0 auto}
.muted{color:var(--mute)}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-bottom:2px solid var(--line);padding:12px max(5vw,16px);background:var(--wall)}
.code{font:800 22px "Baloo 2";letter-spacing:.05em}
.players{display:flex;gap:8px;flex-wrap:wrap}
.pl{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.pl.me{border-color:var(--blue2)}
.pl i{font-style:normal;color:var(--blue2);margin-left:6px}
.stage{display:flex;gap:clamp(20px,4vw,48px);flex-wrap:wrap;align-items:flex-start}
.stage>.door{width:min(200px,46vw)}
.side{flex:1 1 320px}
.timer{font:800 clamp(44px,8vw,64px)/1 "Baloo 2";font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:12px;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);color:var(--ink);border:2px solid var(--line);font-weight:700}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.banner{background:var(--red);color:#fff;border-radius:14px;padding:10px 16px;font:800 22px "Baloo 2";margin:14px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;margin-top:14px}
th,td{padding:10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
th{font-size:14px;color:var(--mute)}
td.c{cursor:default}
td.c.h{cursor:pointer}
td.c.h:hover{background:var(--wall)}
.pt{display:inline-block;min-width:34px;text-align:center;border-radius:8px;font-weight:800;font-size:14px;padding:1px 6px;margin-left:6px;background:var(--wall)}
.pt.p10{background:var(--ok);color:var(--bg)}.pt.p5{background:#f5b301;color:#10213a}
.x{text-decoration:line-through;color:var(--mute)}
.sum td{font:800 20px "Baloo 2"}
.rules{margin:0;padding-left:20px}
.note{font-size:14px;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.85);opacity:0}}}
@media(max-width:600px){table{font-size:14px}.stage>.door{margin:0 auto}}
td.mine{background:light-dark(#fde8e7,#3a1716)}.vt{display:inline-block;margin-left:6px;border-radius:8px;padding:0 6px;font-size:13px;font-weight:800;background:var(--red);color:#fff}
.timer.hot{color:var(--red)}
.rank{margin:8px 0 0;padding-left:24px;font-size:18px}.rank li{padding:4px 0}.rank b{margin-left:10px;color:var(--blue2)}
.langBtn{min-height:36px;padding:0 14px;font-size:15px}
.langTop{display:flex;justify-content:flex-end;padding:12px max(5vw,16px) 0}
[dir=rtl] body{font-family:"Baloo Bhaijaan 2",Nunito,system-ui,sans-serif}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] .timer,[dir=rtl] .banner{font-family:"Baloo Bhaijaan 2","Baloo 2",sans-serif}
.door.ar b{font-family:"Baloo Bhaijaan 2","Baloo 2",sans-serif;line-height:1.3}
[dir=rtl] .door::after{right:auto;left:22%}
[dir=rtl] th,[dir=rtl] td{text-align:right}
.rules{padding-inline-start:20px;padding-left:revert}
.pts{display:flex;align-items:center;gap:4px;margin-top:6px}
.pts .pt{margin:0;min-width:38px}
button.mini{min-height:32px;min-width:32px;padding:0;border-radius:8px;font-size:18px;line-height:1}
button.mini.ghost{border-width:1px;font-size:16px}
.edited{margin-top:2px}
.rank b{margin-inline-start:10px;margin-left:revert}
.pl i{margin-inline-start:6px;margin-left:revert}
</style>
</head>
<body>
<main id="join">
 <div class="langTop"><button class="ghost langBtn">العربية</button></div>
 <div class="band hero">
  <div class="door"><b>B</b></div>
  <div>
   <h1 data-t="title"></h1>
   <p class="muted" data-t="intro"></p>
   <div class="card">
    <label for="nm" data-t="name"></label>
    <input id="nm" maxlength="20" data-ph="namePh" autocomplete="nickname" dir="auto">
    <div class="row" style="margin-top:14px">
     <button id="bNew" data-t="newRoom"></button>
    </div>
    <div class="row" style="margin-top:14px">
     <div><label for="cd" data-t="haveCode"></label><input id="cd" maxlength="6" placeholder="KSKS" dir="ltr" style="text-transform:uppercase"></div>
     <button id="bJoin" class="ghost" data-t="join"></button>
    </div>
    <p class="note" id="jmsg"></p>
   </div>
  </div>
 </div>
 <div class="band">
  <h2 data-t="rulesT"></h2>
  <ul class="rules" id="rules"></ul>
 </div>
</main>

<div id="game" hidden>
 <div class="top">
  <div><span class="muted" data-t="room"></span> <span class="code" id="tCode" dir="ltr"></span> <button class="ghost" id="bCopy" data-t="copy"></button> <button class="ghost langBtn">العربية</button> <span class="note" id="conn" hidden data-t="lost"></span></div>
  <div class="players" id="players"></div>
 </div>
 <div class="band" id="stage"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
